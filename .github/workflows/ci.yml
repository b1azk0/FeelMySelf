# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          WOO_API_BASE: https://www.feelmyself.pl/wp-json/wc/store/v1

      # CF Pages' GitHub App integration occasionally misses push triggers.
      # As a belt-and-braces measure, fire the deploy hook explicitly after
      # CI is green on main. CF rebuilds with current main + current env vars.
      - name: Trigger Cloudflare Pages deploy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          response=$(curl -s -X POST -w "%{http_code}" -o /dev/null "$DEPLOY_HOOK_URL")
          echo "Deploy hook returned HTTP $response"
          if [ "$response" != "200" ]; then
            exit 1
          fi
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
